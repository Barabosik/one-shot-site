<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>Link-Vorschau · {{site.name}}</title>
  <meta name="robots" content="noindex">
  <script type="module" src="/src/main.js"></script>
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { background: var(--ground); }
    .og { --wheel: 120px; position: relative; width: 1200px; height: 630px; padding: 36px 40px 0; }
    .og .van { margin: 0; height: 494px; padding: 44px 56px 0; border-radius: 10px 190px 10px 10px; }
    .og h1 { font-stretch: 150%; font-weight: 800; font-size: 76px; line-height: 0.95; letter-spacing: -0.02em; }
    .og .trade { font-size: 26px; margin-top: 6px; max-width: none; }
    .og .number { font-size: 150px; margin-top: 14px; }
    .og .van-stripe { bottom: 40px; height: 16px; }
    .og .van-window { display: block; top: 40px; right: 80px; width: 200px; height: 170px; border-radius: 8px 120px 8px 8px;
      background: linear-gradient(118deg, var(--van-glass) 58%, var(--van-shine) 58% 66%, var(--van-glass) 66%); }
    .og .wheel { border-width: 10px; }
    .og .van::after { left: -40px; right: -40px; }
  </style>
</head>
<body>
  <div class="og hero">
    <div class="van">
      <h1 translate="no">{{site.name}}</h1>
      <p class="trade">Sanitär und Heizung, Meisterbetrieb in {{site.district}}</p>
      <p class="number">{{site.phone}}</p>
      <span class="van-window" aria-hidden="true"></span>
      <span class="van-stripe" aria-hidden="true"></span>
      <span class="wheel back" aria-hidden="true"></span>
      <span class="wheel front" aria-hidden="true"></span>
    </div>
  </div>
</body>
</html>
