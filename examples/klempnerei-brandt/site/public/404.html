<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Seite nicht gefunden · Klempnerei Brandt</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Self-contained on purpose: hosts serve this file as-is for any missing path. Colours from tokens.css. -->
  <style>
    :root { --van: oklch(26% 0.078 264); --van-ink: oklch(97% 0.008 264); --accent: oklch(81.3% 0.167 82); color-scheme: dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-content: center; padding: 1.5rem; background: var(--van); color: var(--van-ink); font: 1.15rem/1.5 system-ui, sans-serif; }
    main { max-width: 34rem; }
    h1 { font-size: clamp(2.4rem, 8vw, 4.5rem); line-height: 1; margin: 0 0 1rem; letter-spacing: -0.02em; }
    .stripe { height: 0.6rem; background: var(--accent); margin-bottom: 1.5rem; width: 6rem; }
    a { color: var(--accent); font-weight: 700; text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="stripe" aria-hidden="true"></div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Vielleicht ist sie umgezogen. <a href="/">Zur Startseite</a>, dort steht auch die Telefonnummer.</p>
  </main>
</body>
</html>
