<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Page not found · Moth Orchestra</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Self-contained on purpose: hosts serve this file as-is for any missing path. The site's colours. -->
  <style>
    :root { --ground: oklch(28.1% 0.025 156.2); --deep: oklch(21.5% 0.022 158); --ink: oklch(92% 0.028 88.8); --muted: oklch(77.6% 0.025 122.8); --accent: oklch(68.1% 0.115 86); --accent-text: oklch(77.3% 0.107 85.4); --glow: oklch(86% 0.11 88); color-scheme: dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-content: center; padding: 1.5rem; color: var(--ink); font: 1.15rem/1.55 Arial, system-ui, sans-serif;
      background: radial-gradient(60% 50% at 50% 0%, color-mix(in oklch, var(--glow) 16%, transparent), transparent 70%), radial-gradient(120% 90% at 50% 10%, var(--ground) 35%, var(--deep)); }
    h1 { font: 400 clamp(3rem, 12vw, 7rem)/0.95 'Times New Roman', serif; letter-spacing: -0.02em; margin: 0 0 1.25rem; }
    p { margin: 0; max-width: 32ch; color: var(--muted); }
    a { color: var(--accent-text); text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
    ::selection { background: var(--accent); color: oklch(16% 0.02 86); }
  </style>
</head>
<body>
  <main>
    <h1>The light’s off in here.</h1>
    <p>There’s no page at this address. <a href="/">Back to the tour dates</a>.</p>
  </main>
</body>
