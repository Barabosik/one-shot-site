  <title>Kleiner Kaffee · link preview</title>
  <script type="module" src="/src/main.js"></script>
  <style>
    html:root { --og-ink: var(--accent-ink); }
    body.og { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--accent); color: var(--og-ink); }
    .og-card { display: grid; grid-template-columns: 1fr 420px; align-items: center; gap: 48px; height: 630px; padding: 0 72px; box-sizing: border-box; }
    .og-name { font-family: var(--font-display); font-weight: 600; font-size: 40px; letter-spacing: -0.01em; }
    .og-card h1 { font-size: 76px; line-height: 1.04; margin: 28px 0 0; max-width: 12ch; color: var(--og-ink); }
    .og-place { margin-top: 32px; font-size: 28px; font-weight: 600; }
    .og .roaster { width: 420px; height: auto; --roast: var(--copper); --roast-deep: var(--roast-light); --roast-light: var(--copper-light); --shadow-ink: rgb(0 0 0 / 0.18); }
  </style>
</head>
