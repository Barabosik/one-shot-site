<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <meta name="robots" content="noindex">
  <title>Jonas Weber: link preview</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/main.js"></script>
  <style>
    html:root { --ground: oklch(76.5% 0.175 62.6); --ink: oklch(16% 0.02 62.6); --muted: oklch(28% 0.03 62.6); color-scheme: light; }
    .og { width: 1200px; height: 630px; overflow: hidden; margin: 0; min-height: 0; padding: 48px 64px; display: grid; grid-template-rows: auto 1fr auto; gap: 28px; background: var(--ground); color: var(--ink); }
    .og .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 26px; }
    .og .top b { font-family: var(--font-display); font-weight: 900; font-stretch: 112%; font-size: 34px; letter-spacing: -0.01em; }
    .og ul { list-style: none; margin: 0; padding: 0; align-self: center; border-bottom: 5px solid var(--ink); }
    .og li { border-top: 5px solid var(--ink); padding: 6px 0 4px; font-family: var(--font-display); font-weight: 900; font-stretch: 112%; font-size: 112px; line-height: 0.86; letter-spacing: -0.03em; }
    .og .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; font-size: 26px; }
    .og p { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 36px; letter-spacing: -0.015em; }
  </style>
</head>
<body class="og">
  <div class="top"><b>Jonas Weber</b><span>App developer, Leipzig</span></div>
  <ul>
    <li>Tide</li>
    <li>Groundwork</li>
    <li>Mono</li>
  </ul>
  <div class="foot"><p>I build phone apps that do one job each.</p><span>Booking spring 2027</span></div>
</body>
</html>
