<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=1200">
  <title>one-shot-site link preview</title>
  <!-- Only for images.mjs og: photographed at 1200×630 into public/og.jpg, the page's link preview. -->
  <script type="module">import '@fontsource-variable/schibsted-grotesk';</script>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f8f6f5; color: #191616; font-family: 'Schibsted Grotesk Variable', Arial, sans-serif; }
    .word { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 720; letter-spacing: -0.02em; }
    .tag { display: grid; place-items: center; width: 40px; height: 40px; background: #ff2d75; color: #fff; font-weight: 800; font-size: 26px; border-radius: 0 0 11px 0; }
    h1 { position: absolute; left: 64px; top: 138px; width: 580px; margin: 0; font-size: 62px; line-height: 1; letter-spacing: -0.04em; font-weight: 760; }
    h1 span { display: block; }
    h1 span + span { margin-top: 0.12em; }
    .foot { position: absolute; left: 64px; bottom: 54px; font-size: 24px; font-weight: 560; color: #5c5757; }
    .foot b { color: #191616; }
    .win { position: absolute; left: 660px; top: 92px; width: 720px; background: #ece9e7; border-radius: 18px; overflow: hidden; }
    .bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
    .dots { width: 44px; height: 12px; background: radial-gradient(circle at 6px 50%, #d6d1cf 5px, transparent 5.5px), radial-gradient(circle at 22px 50%, #d6d1cf 5px, transparent 5.5px), radial-gradient(circle at 38px 50%, #d6d1cf 5px, transparent 5.5px); }
    .addr { flex: 1; margin: 0; padding: 8px 14px; border-radius: 9px; background: #fefdfd; font-size: 18px; white-space: nowrap; overflow: hidden; }
    .addr i { font-style: normal; color: #cf005a; }
    .win img { display: block; width: 720px; height: 450px; object-fit: cover; object-position: top; }
  </style>
</head>
<body>
  <div class="word"><span class="tag">1</span>one-shot-site</div>
  <h1><span>A few questions in.</span> <span>A finished, checked website out.</span></h1>
  <p class="foot"><b>One shot:</b> you answer once, it does the rest.</p>
  <div class="win">
    <div class="bar"><span class="dots"></span><p class="addr">A small business · <i>Warm</i> · Gentle motion</p></div>
    <img src="shots/kleiner-kaffee-desktop.jpg" alt="">
  </div>
</body>
</html>
